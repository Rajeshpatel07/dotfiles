# ==============================================================================
# 1. GENERAL & TERMINAL CAPABILITIES (Fixes SIXEL graphics in Tmux)
# ==============================================================================
# Declare 256-color support
set -g default-terminal "tmux-256color"

# Inform Tmux that Foot supports SIXEL graphics & TrueColor
set -as terminal-features ',foot*:sixel'
set -as terminal-overrides ',foot*:Tc,foot*:sixel'

# Eliminate command/escape sequence delay
set -s escape-time 0

# Enable passthrough for image sequences
set -g allow-passthrough on

# Prevent Tmux status bar auto-refresh ticks from erasing SIXEL overlays
set -g status-interval 60

# Pass terminal environment variables into tmux
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Disable activity alerts that trigger pane redraws
set -g visual-activity off

# ==============================================================================
# 2. KEYBINDINGS & NAVIGATION
# ==============================================================================
# Set leader key
set -g prefix C-a

# Break the current pane
bind b break-pane -dP

# Switching panels
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload the config
bind r source-file ~/.tmux.conf

# Zoom pane layout toggle
bind m if -F '#{@layout_save}' \
    {run 'tmux select-layout "#{@layout_save}" ; set -u @layout_save'} \
    {set -Fp @layout_save "#{window_layout}" ; run 'tmux resize-pane -Z'}

# ==============================================================================
# 3. UI & MOUSE
# ==============================================================================
set -g mouse on
set -g status-position top
set -g base-index 1

# ==============================================================================
# 4. PLUGINS
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_user 'off'
set -g @rose_pine_date_time '%H:%M'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
