# ==============================================================================
# 1. FONT & GRAPHICS (Ligatures Enabled)
# ==============================================================================
font_family      JetBrains Mono Nerd Font
font_size        12.8

# Explicitly leaves ligatures perfectly functional
disable_ligatures never

# Disable config auto-reload
auto_reload_config -1
# ==============================================================================
# 2. MAXIMUM MEMORY & TMUX RAM OPTIMIZATIONS
# ==============================================================================
scrollback_lines 0

update_check_interval 0

tab_bar_style hidden

repaint_delay    8
input_delay      2
sync_to_monitor  yes

enable_audio_bell no

# ==============================================================================
# 3. WINDOW GEOMETRY & VISUALS
# ==============================================================================
background_opacity 0.9
background_blur    0
window_padding_width 1 1
cursor_shape       beam

# ==============================================================================
# 4. COLOR PALETTE
# ==============================================================================
background           black
foreground           white
selection_background #073642
selection_foreground #eee8d5

# ==============================================================================
# 5. URLS & KEYBINDINGS
# ==============================================================================
url_style     curly
open_url_with default

map ctrl+shift+n new_os_window
